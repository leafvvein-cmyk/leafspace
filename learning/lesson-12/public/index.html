<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第 12 课 · 账号与密码安全</title><link rel="stylesheet" href="/styles.css"></head><body>
<header class="topbar"><a class="brand" href="#main">安全登录练习</a><span class="lesson-badge">LESSON 12</span></header><main id="main" class="page-shell"><section class="intro"><p class="eyebrow">ARGON2ID + SESSION</p><h1>只用账号和密码安全登录</h1><p>没有短信验证码、手机号验证、Apple 或第三方登录。本课数据库与正式账号完全隔离。</p></section>
<p id="status" class="notice" role="status" aria-live="polite">正在检查登录状态…</p>
<section id="guest-panel" class="auth-grid"><form id="register-form" class="card" novalidate><h2>注册练习账号</h2><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="new-password" required></label><label>确认密码<input name="confirmation" type="password" autocomplete="new-password" required></label><p class="hint">账号 3–32 位；密码 12–128 字符。</p><p class="error" role="alert" hidden></p><button type="submit">注册并登录</button></form>
<form id="login-form" class="card" novalidate><h2>账号密码登录</h2><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><p class="error" role="alert" hidden></p><button type="submit">登录</button></form></section>
<section id="recovery-panel" class="card recovery" hidden><p class="eyebrow">ONLY ONCE</p><h2>立即保存恢复码</h2><code id="recovery-code"></code><p>刷新后不会再次显示。它与密码本恢复密钥不是同一个东西。</p><label class="check"><input id="recovery-confirm" type="checkbox"> 我已离线保存恢复码</label><button id="close-recovery" type="button" disabled>关闭提示</button></section>
<section id="account-panel" class="card" hidden><p class="eyebrow">SIGNED IN</p><h2 id="welcome"></h2><p>会话令牌只在 HttpOnly Cookie 中，页面 JavaScript 读不到。</p><button id="logout-button" class="secondary" type="button">退出登录</button></section>
<details class="card reset"><summary>忘记密码：使用一次性恢复码</summary><form id="reset-form" novalidate><label>账号<input name="username" autocomplete="username"></label><label>恢复码<input name="recoveryCode" autocomplete="off"></label><label>新密码<input name="newPassword" type="password" autocomplete="new-password"></label><p class="error" role="alert" hidden></p><button type="submit">重置密码并撤销会话</button></form></details>
</main><script type="module" src="/client.js"></script></body></html>
