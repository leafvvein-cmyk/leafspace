<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>第 10 课 · Express 路由</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="topbar"><a class="brand" href="#main">Express 日记练习</a><span class="lesson-badge">LESSON 10</span></header>
    <main id="main" class="page-shell">
      <section class="intro"><p class="eyebrow">ROUTER + MIDDLEWARE</p><h1>把接口拆成清楚的职责</h1><p>数据仍保存在本机服务器内存，重启后清空，不属于正式账号。</p></section>
      <p id="request-status" class="notice" role="status" aria-live="polite">正在读取 Express API…</p>
      <form id="entry-form" class="editor-card" novalidate>
        <div class="field"><label for="entry-title">标题</label><input id="entry-title" maxlength="80" autocomplete="off"></div>
        <div class="field"><label for="entry-content">正文</label><textarea id="entry-content" maxlength="5000" rows="5"></textarea></div>
        <p id="form-error" class="error" role="alert" hidden></p>
        <button class="primary-button" type="submit">创建日记</button>
      </form>
      <section class="results" aria-labelledby="list-title">
        <div class="result-heading"><h2 id="list-title">Express 返回的日记</h2><output id="entry-count">0 篇</output></div>
        <div id="entry-list" class="entry-list"></div>
      </section>
    </main>
    <script type="module" src="/client.js"></script>
  </body>
</html>
