name: diary-v2
services:
  postgres:
    image: postgres@sha256:5b96f1a16bd9768b060dd2ffe55cb6225c4d9ef4d214a8b21eb08134869a97e4
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary_local_development_only
      POSTGRES_DB: diary_dev
    volumes:
      - diary-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diary -d diary_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  diary-postgres:
